name: Release & Distribute

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish-container-package:
    name: Publish Container Image to GitHub Packages (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-npm-package:
    name: Publish npm Package to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://npm.pkg.github.com'
          scope: '@vs153698'

      - name: Publish to GitHub Package Registry
        run: |
          cd packages/npm
          npm publish || echo "Package version already published, continuing."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: aimux
            asset_name: aimux-Darwin-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: aimux
            asset_name: aimux-Darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: aimux
            asset_name: aimux-Linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: aimux.exe
            asset_name: aimux-Windows-x86_64.exe

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI Binary
        run: cargo build --release --target ${{ matrix.target }} -p aimux-cli

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}

      - name: Upload CLI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-desktop-macos:
    name: Build Desktop macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build UI Web Assets
        run: |
          cd crates/aimux-desktop/ui
          npm install
          npm run build

      - name: Build Desktop Release Binary
        run: cargo build --release -p aimux-desktop

      - name: Package AIMux.app Bundle
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh
          cd target/release/bundle/osx
          tar -czf ../../../AIMux.app.tar.gz AIMux.app

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-app
          path: target/AIMux.app.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-cli, build-desktop-macos, publish-container-package, publish-npm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
